_format_version: "3.0"
_transform: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - http://localhost:8080
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
      preflight_continue: false

services:
  - name: community_service
    url: http://community_service:5001
    routes:
      - name: community_specific_route
        paths:
          - /api/community/\d+
        methods:
          - GET
        strip_path: false
        preserve_host: true

      - name: community_name_specific_route
        paths:
          - /api/community/name/
        methods:
          - GET
        strip_path: false
        preserve_host: true
        
      - name: community_creator_route
        paths:
          - /api/community/creator/
        methods:
          - GET
        strip_path: false
        preserve_host: true
        
      - name: community_base_route
        paths:
          - /api/community
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: true

  - name: post_service
    url: http://post_service:5002
    routes:
      - name: post_status_route
        paths:
          - /api/post/\d+/status
        methods:
          - PUT
        strip_path: false
        preserve_host: true
          
      - name: post_specific_route
        paths:
          - /api/post/\d+
        methods:
          - GET
        strip_path: false
        preserve_host: true
      
      - name: posts_by_community_route
        paths:
          - /api/posts/community/
        methods:
          - GET
        strip_path: false
        preserve_host: true
          
      - name: posts_by_author_route
        paths:
          - /api/posts/author/
        methods:
          - GET
        strip_path: false
        preserve_host: true
        
      - name: post_base_route
        paths:
          - /api/post
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: true
      
      - name: posts_all_route
        paths:
          - /api/posts
        methods:
          - GET
        strip_path: false
        preserve_host: true

  - name: comment_service
    url: http://comment_service:5003
    routes:
      - name: comment_status_route
        paths:
          - /api/comment/\d+/status
        methods:
